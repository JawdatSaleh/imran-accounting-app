<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>حسابات عمران الخليج</title>

<style>
  :root{
    --brand:#5a9ff2;
    --brand-dark:#4a90e2;
    --ok:#0a8f5a;
    --danger:#d7263d;
  }
  body{font-family:Arial,Tahoma,sans-serif;background:#f6f7fb;margin:0;color:#222}
  header{background:var(--brand);color:#fff;padding:16px 18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  header h1{margin:0;font-size:20px}
  .container{max-width:1150px;margin:20px auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.06)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  
  /* تصميم البطاقة الجديد */
  .card{
    background:var(--brand);
    color:#fff;
    padding:18px;
    border-radius:14px;
    text-align:center;
    position:relative;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    transition:transform .2s;
  }
  .card:hover{transform:translateY(-3px);}
  .card small{opacity:.9;display:block;margin-top:5px;font-size:14px}
  .card .big{font-size:28px;font-weight:bold;margin-bottom:5px;}
  .card .expected{font-size:13px;opacity:.9;margin-bottom:6px;}
  .edit-btn{
    position:absolute;top:8px;right:8px;
    background:rgba(255,255,255,.25);border:none;color:#fff;
    border-radius:50%;width:26px;height:26px;cursor:pointer;
    font-size:14px;line-height:26px;
  }
  .edit-btn:hover{background:rgba(255,255,255,.4)}
  
  .progress-container{background:#eaeaea;border-radius:10px;height:12px;overflow:hidden;margin-top:8px;position:relative}
  .progress-bar{height:100%;background:var(--ok);width:0%;transition:width .35s}
  .progress-container span{
    position:absolute;top:-22px;right:10px;font-size:12px;color:#fff;
    background:rgba(0,0,0,.25);padding:2px 6px;border-radius:6px;
  }

  input,select,button{padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px}
  button{background:var(--brand);color:#fff;border:none;cursor:pointer}
  button:hover{background:var(--brand-dark)}
  .btn-okay{background:var(--ok)} .btn-okay:hover{filter:brightness(.95)}
  .btn-danger{background:var(--danger)} .btn-danger:hover{filter:brightness(.95)}
  
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{border-bottom:1px solid #eee;padding:10px;text-align:center}
  thead th{background:var(--brand);color:#fff;position:sticky;top:0}
  .muted{color:#666}
  .login{max-width:420px;margin:40px auto;text-align:center}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .toolbar input[type="search"]{min-width:260px}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKz2deoXAI_jBcclRuQS1bZCIROLZaYzs",
  authDomain: "omran-accounting.firebaseapp.com",
  projectId: "omran-accounting",
  storageBucket: "omran-accounting.firebasestorage.app",
  messagingSenderId: "839133682089",
  appId: "1:839133682089:web:6b2f521e55dc5183848cb8",
  measurementId: "G-NE88J3J52F"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const entriesRef = collection(db,"entries");

const categories = ["عهد مسجد المدينة","مصاريف A1","مصاريف A2","مصاريف المؤسسة","ديون","مصاريف الداير"];
let entries=[],filteredEntries=[];
let currentUserEmail=null;

const defaultExpected = {
  "مصاريف الداير":3000,
  "مصاريف A1":5000,
  "مصاريف A2":5000,
  "عهد مسجد المدينة":4000,
  "مصاريف المؤسسة":6000,
  "ديون":2000,
  "إجمالي الإيرادات":8000
};
let expectedTotals=JSON.parse(localStorage.getItem("expectedTotals")||"null")||structuredClone(defaultExpected);

const $=s=>document.querySelector(s);
const tbody=$("#entriesBody");

function translateType(t){return t==="expense"?"مصروف":t==="income"?"إيراد":t==="transfer"?"تحويل":t;}
function translateLocation(l){return l==="cash"?"الصندوق":l==="bank"?"البنك":l;}

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUserEmail=user.email;
    $("#loginBox").style.display="none";
    $("#app").style.display="block";
    $("#userEmail").textContent=currentUserEmail;
    $("#entryDate").valueAsDate=new Date();
    populateCategories();
    await loadEntries();
  }else{
    $("#app").style.display="none";
    $("#loginBox").style.display="block";
  }
});

window.login=async()=>{
  try{
    await signInWithEmailAndPassword(auth,$("#email").value,$("#password").value);
  }catch(e){alert("خطأ: "+e.message);}
};
window.logout=()=>signOut(auth);

async function loadEntries(){
  const qy=query(entriesRef,orderBy("createdAt","desc"));
  const snap=await getDocs(qy).catch(()=>getDocs(entriesRef));
  const list=[];
  snap.forEach(d=>list.push({id:d.id,...d.data()}));
  list.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  entries=list;filteredEntries=list;renderEntries();
}

async function saveEntry(e){await addDoc(entriesRef,{...e,createdAt:serverTimestamp()});}
async function removeEntry(id){await deleteDoc(doc(db,"entries",id));}
window.deleteEntry=async id=>{if(!confirm("تأكيد الحذف؟"))return;await removeEntry(id);await loadEntries();};

window.editExpected=cat=>{
  const nv=prompt(`أدخل المبلغ المتوقع لـ "${cat}"`,expectedTotals[cat]||0);
  if(nv!==null&&!isNaN(parseFloat(nv))){
    expectedTotals[cat]=parseFloat(nv);
    localStorage.setItem("expectedTotals",JSON.stringify(expectedTotals));
    updateTotals();
  }
};

function updateTotals(){
  let totalExpenses=0,totalIncome=0,cash=0,bank=0;
  const catTotals=Object.fromEntries(categories.map(c=>[c,0]));
  
  filteredEntries.forEach(e=>{
    const amount=Number(e.amount||0);
    if(e.type==="expense"){totalExpenses+=amount;if(e.location==="cash")cash-=amount;else bank-=amount;if(catTotals[e.category]!=null)catTotals[e.category]+=amount;}
    else if(e.type==="income"){totalIncome+=amount;if(e.location==="cash")cash+=amount;else bank+=amount;}
    else if(e.type==="transfer"){if(e.location==="cash"){cash-=amount;bank+=amount;}else{bank-=amount;cash+=amount;}}
  });

  $("#cashBalance").textContent=cash.toFixed(2)+" ر.س";
  $("#bankBalance").textContent=bank.toFixed(2)+" ر.س";

  const row=$("#categoryProgress");
  row.innerHTML="";
  
  const incomeCard=document.createElement("div");
  const percI=expectedTotals["إجمالي الإيرادات"]?Math.min(totalIncome/expectedTotals["إجمالي الإيرادات"]*100,100):0;
  const barColorI=percI>=100?"var(--danger)":"var(--ok)";
  incomeCard.className="card";
  incomeCard.innerHTML=`
    <button class="edit-btn" onclick="editExpected('إجمالي الإيرادات')">✏️</button>
    <div class="big">${totalIncome.toFixed(2)} ر.س</div>
    <div class="expected">من ${expectedTotals["إجمالي الإيرادات"]} ر.س</div>
    <div class="progress-container">
      <div class="progress-bar" style="width:${percI}%;background:${barColorI}"></div>
      <span>${percI.toFixed(1)}%</span>
    </div>
    <small>إجمالي الإيرادات</small>`;
  row.appendChild(incomeCard);

  for(const cat of categories){
    const sum=catTotals[cat]||0;
    const exp=expectedTotals[cat]||0;
    const perc=exp?Math.min(sum/exp*100,100):0;
    const barColor=perc>=100?"var(--danger)":"var(--ok)";
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <button class="edit-btn" onclick="editExpected('${cat}')">✏️</button>
      <div class="big">${sum.toFixed(2)} ر.س</div>
      <div class="expected">من ${exp.toFixed(2)} ر.س</div>
      <div class="progress-container">
        <div class="progress-bar" style="width:${perc}%;background:${barColor}"></div>
        <span>${perc.toFixed(1)}%</span>
      </div>
      <small>${cat}</small>`;
    row.appendChild(card);
  }
}

function renderEntries(){
  tbody.innerHTML="";
  filteredEntries.forEach(e=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${e.id?.slice?.(0,6)||""}</td><td>${e.date||""}</td><td>${translateType(e.type)}</td>
      <td>${Number(e.amount||0).toFixed(2)}</td><td>${e.category||""}</td><td>${translateLocation(e.location)}</td>
      <td>${e.user||""}</td><td>${e.notes||""}</td>
      <td><button class="btn-danger" onclick="deleteEntry('${e.id}')">حذف</button></td>`;
    tbody.appendChild(tr);
  });
  updateTotals();
}

function populateCategories(){
  const sel=$("#entryCategory");
  sel.innerHTML="";
  categories.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
}

window.submitEntry=async()=>{
  const date=$("#entryDate").value,type=$("#entryType").value,amount=parseFloat($("#entryAmount").value),
        category=$("#entryCategory").value,location=$("#entryLocation").value,notes=$("#entryNotes").value;
  if(!date||isNaN(amount)||!category||!location){alert("الرجاء إدخال جميع الحقول");return;}
  const entry={date,type,amount,category,location,user:currentUserEmail,notes};
  await saveEntry(entry);
  $("#entryAmount").value="";$("#entryNotes").value="";await loadEntries();alert("✅ تم الحفظ");
};
</script>
</head>
<body>

<header><h1>حسابات عمران الخليج</h1></header>

<div id="loginBox" class="container login">
  <h3>تسجيل الدخول</h3>
  <input id="email" type="email" placeholder="البريد الإلكتروني" /><br><br>
  <input id="password" type="password" placeholder="كلمة المرور" /><br><br>
  <button onclick="login()">دخول</button>
</div>

<div id="app" class="container" style="display:none;">
  <div class="toolbar">
    <span class="muted">مرحبًا: <b id="userEmail"></b></span>
    <button class="btn-danger" style="margin-right:auto" onclick="logout()">تسجيل الخروج</button>
  </div>

  <!-- بطاقات الفئات والإيرادات -->
  <div id="categoryProgress" class="grid"></div>

  <h3>إضافة عملية</h3>
  <div class="row">
    <input type="date" id="entryDate">
    <select id="entryType">
      <option value="expense">مصروف</option>
      <option value="income">إيراد</option>
    </select>
    <input type="number" id="entryAmount" step="0.01" placeholder="المبلغ (ر.س)">
    <select id="entryCategory"></select>
    <select id="entryLocation">
      <option value="cash">الصندوق</option>
      <option value="bank">البنك</option>
    </select>
    <input type="text" id="entryNotes" placeholder="ملاحظات">
    <button class="btn-okay" onclick="submitEntry()">إضافة</button>
  </div>

  <h3>السجلات</h3>
  <table>
    <thead>
      <tr>
        <th>#</th><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الفئة</th>
        <th>الموقع</th><th>المستخدم</th><th>ملاحظات</th><th>إجراء</th>
      </tr>
    </thead>
    <tbody id="entriesBody"></tbody>
  </table>
</div>
</body>
</html>
